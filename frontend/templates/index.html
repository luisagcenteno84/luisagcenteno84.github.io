<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <p class="tag">Portfolio</p>
      <h1>{{ title }}</h1>
      <p class="subtitle">{{ subtitle }}</p>
    </section>

    <section class="switcher" aria-label="App selector">
      {% for app in apps %}
      <button class="app-btn{% if loop.index0 == 0 %} is-active{% endif %}" data-url="{{ app.url }}" data-title="{{ app.title }}">{{ app.title }}</button>
      {% endfor %}
    </section>

    <section class="embed-shell">
      <div class="embed-header">
        <h2 id="embedTitle">{{ default_app.title }}</h2>
      </div>
      <iframe
        id="appFrame"
        class="app-frame"
        src="{{ default_app.url }}"
        title="{{ default_app.title }}"
        loading="eager"
        referrerpolicy="no-referrer"
      ></iframe>
    </section>
  </main>

  <script>
    const buttons = document.querySelectorAll('.app-btn');
    const frame = document.getElementById('appFrame');
    const title = document.getElementById('embedTitle');

    buttons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const nextUrl = btn.dataset.url;
        const nextTitle = btn.dataset.title;

        frame.src = nextUrl;
        frame.title = nextTitle;
        title.textContent = nextTitle;

        buttons.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');
      });
    });
  </script>
</body>
</html>
