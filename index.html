<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Luis Centeno | App Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <p class="tag">Portfolio</p>
      <h1>Luis Centeno | App Portfolio</h1>
      <p class="subtitle">Pick an app below to load it in the live preview.</p>
    </section>

    <section class="switcher" aria-label="App selector">
      <button class="app-btn is-active" data-url="https://upcoming-sports-games-frontend-7ijtcmg2ca-uc.a.run.app/" data-title="Sports Tracker">Sports Tracker</button>
      <button class="app-btn" data-url="https://thoughts-publisher-frontend-cuutda4jvq-uc.a.run.app/" data-title="Thoughts">Thoughts</button>
      <button class="app-btn" data-url="https://task-priority-organizer-frontend-oucod7neda-uc.a.run.app/" data-title="Task Org">Task Org</button>
    </section>

    <section class="embed-shell">
      <div class="embed-header">
        <h2 id="embedTitle">Sports Tracker</h2>
      </div>
      <iframe
        id="appFrame"
        class="app-frame"
        src="https://upcoming-sports-games-frontend-7ijtcmg2ca-uc.a.run.app/"
        title="Sports Tracker"
        loading="eager"
        referrerpolicy="no-referrer"
      ></iframe>
    </section>
  </main>

  <script>
    const buttons = document.querySelectorAll('.app-btn');
    const frame = document.getElementById('appFrame');
    const title = document.getElementById('embedTitle');

    buttons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const nextUrl = btn.dataset.url;
        const nextTitle = btn.dataset.title;

        frame.src = nextUrl;
        frame.title = nextTitle;
        title.textContent = nextTitle;

        buttons.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');
      });
    });
  </script>
</body>
</html>
